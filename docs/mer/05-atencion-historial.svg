<rect x="1640.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1670.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s60"><rect x="1240.0" y="601" width="60" height="22" fill="#ffffff" /><text x="1270.0" y="612" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s62"><rect x="1880" y="1265.0" width="60" height="22" fill="#ffffff" /><text x="1910" y="1276.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,1)</text></g><g id="s64"><rect x="500.0" y="1341" width="60" height="22" fill="#ffffff" /><text x="530.0" y="1352" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s66"><rect x="1640.0" y="1341" width="60" height="22" fill="#ffffff" /><text x="1670.0" y="1352" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,1)</text></g><g id="s67"><text x="70" y="56" font-family="Arial" font-size="19" fill="#56657a" text-anchor="start" dominant-baseline="central">ARGOS  /  MODELO ENTIDAD–RELACIÓN</text></g><g id="s68"><text x="70" y="110" font-family="Arial" font-size="36" fill="#233247" text-anchor="start" dominant-baseline="central" font-weight="700">Atención, historial y resolución</text></g><g id="s69"><text x="70" y="158" font-family="Arial" font-size="18" fill="#56657a" text-anchor="start" dominant-baseline="central">Notación de Chen · derivado de backend/prisma/schema.prisma · 28 de octubre de 2026</text></g><g id="s70"><text x="70" y="204" font-family="Arial" font-size="18" fill="#233247" text-anchor="start" dominant-baseline="central">Rectángulo: entidad    /    Rombo: relación    /    Óvalo: atributo    /    Subrayado: identificador</text></g><g id="s71"><text x="70" y="242" font-family="Arial" font-size="17" fill="#233247" text-anchor="start" dominant-baseline="central">(mín,máx) junto a cada entidad: participaciones de esa instancia. N = muchas. Línea doble = obligatoria. ? = atributo opcional.</text></g><g id="s72"><text x="70" y="280" font-family="Arial" font-size="16" fill="#56657a" text-anchor="start" dominant-baseline="central">Las entidades en verde son referencias: su definición completa aparece en otra lámina.</text></g><g id="s73"><text x="70" y="2074" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Un evento y un usuario conservan N atenciones históricas, pero como máximo una atención vigente cada uno.</text></g><g id="s74"><text x="70" y="2104" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Cada atención pertenece a una sesión y un usuario; la coherencia entre ambos es una regla adicional.</text></g><g id="s75"><text x="70" y="2134" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">En el historial, usuario y atención son opcionales. Usuario nulo identifica una acción automática.</text></g><g id="s76"><text x="70" y="2164" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Cada evento tiene como máximo una resolución; cada resolución tiene un usuario responsable.</text></g><g id="s77"><text x="2130" y="2188" font-family="Arial" font-size="15" fill="#56657a" text-anchor="end" dominant-baseline="central">05-atencion-historial  ·  Chen</text></g></svg>