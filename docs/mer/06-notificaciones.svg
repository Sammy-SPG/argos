 points="730,710.0 830.0,770 730,830.0 630.0,770" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="730" y="770.0" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">es destinatario</text></g><g id="s31"><polygon points="1470,910.0 1570.0,970 1470,1030.0 1370.0,970" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="1470" y="959.5" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">recibe en</text><text x="1470" y="980.5" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">dispositivo</text></g><g id="s32"><polygon points="1100,910.0 1200.0,970 1100,1030.0 1000.0,970" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="1100" y="970.0" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">motiva aviso</text></g><g id="s33"><polygon points="1470,1280.0 1570.0,1340 1470,1400.0 1370.0,1340" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="1470" y="1340.0" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">registra intento</text></g><g id="s35"><rect x="500.0" y="1281" width="60" height="22" fill="#ffffff" /><text x="530.0" y="1292" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s37"><rect x="900.0" y="601" width="60" height="22" fill="#ffffff" /><text x="930.0" y="612" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s39"><rect x="500.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="530.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s41"><rect x="900.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="930.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s43"><rect x="500.0" y="601" width="60" height="22" fill="#ffffff" /><text x="530.0" y="612" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s45"><rect x="900.0" y="1281" width="60" height="22" fill="#ffffff" /><text x="930.0" y="1292" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s47"><rect x="1640.0" y="601" width="60" height="22" fill="#ffffff" /><text x="1670.0" y="612" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s49"><rect x="1240.0" y="1281" width="60" height="22" fill="#ffffff" /><text x="1270.0" y="1292" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s51"><rect x="1140" y="653.0" width="60" height="22" fill="#ffffff" /><text x="1170" y="664.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s53"><rect x="1140" y="1265.0" width="60" height="22" fill="#ffffff" /><text x="1170" y="1276.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,1)</text></g><g id="s55"><rect x="1240.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1270.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s57"><rect x="1640.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1670.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s58"><text x="70" y="56" font-family="Arial" font-size="19" fill="#56657a" text-anchor="start" dominant-baseline="central">ARGOS  /  MODELO ENTIDAD–RELACIÓN</text></g><g id="s59"><text x="70" y="110" font-family="Arial" font-size="36" fill="#233247" text-anchor="start" dominant-baseline="central" font-weight="700">Notificaciones y escalamiento</text></g><g id="s60"><text x="70" y="158" font-family="Arial" font-size="18" fill="#56657a" text-anchor="start" dominant-baseline="central">Notación de Chen · derivado de backend/prisma/schema.prisma · 28 de octubre de 2026</text></g><g id="s61"><text x="70" y="204" font-family="Arial" font-size="18" fill="#233247" text-anchor="start" dominant-baseline="central">Rectángulo: entidad    /    Rombo: relación    /    Óvalo: atributo    /    Subrayado: identificador</text></g><g id="s62"><text x="70" y="242" font-family="Arial" font-size="17" fill="#233247" text-anchor="start" dominant-baseline="central">(mín,máx) junto a cada entidad: participaciones de esa instancia. N = muchas. Línea doble = obligatoria. ? = atributo opcional.</text></g><g id="s63"><text x="70" y="280" font-family="Arial" font-size="16" fill="#56657a" text-anchor="start" dominant-baseline="central">Las entidades en verde son referencias: su definición completa aparece en otra lámina.</text></g><g id="s64"><text x="70" y="1724" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Una notificación tiene evento, destinatario y dispositivo obligatorios; el escalamiento es opcional.</text></g><g id="s65"><text x="70" y="1754" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">No se repite la combinación de evento, dispositivo y destinatario. Los intentos se numeran por aviso.</text></g><g id="s66"><text x="70" y="1784" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">La coherencia del destinatario con la sesión del dispositivo y del evento con la escalada exige validación.</text></g><g id="s67"><text x="2130" y="1838" font-family="Arial" font-size="15" fill="#56657a" text-anchor="end" dominant-baseline="central">06-notificaciones  ·  Chen</text></g></svg>