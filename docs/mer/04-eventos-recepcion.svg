xt x="1840" y="1332" font-family="Arial" font-size="20" fill="#233247" text-anchor="middle" dominant-baseline="central" font-weight="700">Recepción de señal</text><text x="1840" y="1358" font-family="Arial" font-size="13" fill="#56657a" text-anchor="middle" dominant-baseline="central">RecepcionEvento</text></g><g id="s14"><ellipse cx="1700" cy="1230" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1700" y="1230" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central" text-decoration="underline">id</text></g><g id="s15"><ellipse cx="1980" cy="1230" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1980" y="1230" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">origen</text></g><g id="s16"><ellipse cx="1700" cy="1160" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1700" y="1160" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">codigoExterno ?</text></g><g id="s17"><ellipse cx="1980" cy="1160" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1980" y="1160" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">claveDeduplicacion ?</text></g><g id="s18"><ellipse cx="1700" cy="1090" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1700" y="1090" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">contenido</text></g><g id="s19"><ellipse cx="1980" cy="1090" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1980" y="1090" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">ocurrido ?</text></g><g id="s20"><ellipse cx="1700" cy="1450" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1700" y="1450" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">recibido</text></g><g id="s21"><ellipse cx="1980" cy="1450" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1980" y="1450" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">procesado ?</text></g><g id="s22"><ellipse cx="1700" cy="1520" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1700" y="1520" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">estado</text></g><g id="s23"><ellipse cx="1980" cy="1520" rx="120.0" ry="24.0" fill="#ffffff" stroke="#233247" stroke-width="1.5" /><text x="1980" y="1520" font-family="Arial" font-size="15" fill="#233247" text-anchor="middle" dominant-baseline="central">error ?</text></g><g id="s24"><polygon points="730,910.0 830.0,970 730,1030.0 630.0,970" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="730" y="970.0" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">registra evento</text></g><g id="s25"><polygon points="1100,910.0 1200.0,970 1100,1030.0 1000.0,970" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="1100" y="970.0" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">sitúa evento</text></g><g id="s26"><polygon points="1470,1280.0 1570.0,1340 1470,1400.0 1370.0,1340" fill="#fff2cf" stroke="#233247" stroke-width="1.8" /><text x="1470" y="1340.0" font-family="Arial" font-size="16" fill="#233247" text-anchor="middle" dominant-baseline="central">vincula recepción</text></g><g id="s28"><rect x="500.0" y="601" width="60" height="22" fill="#ffffff" /><text x="530.0" y="612" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s30"><rect x="900.0" y="1281" width="60" height="22" fill="#ffffff" /><text x="930.0" y="1292" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s32"><rect x="1140" y="653.0" width="60" height="22" fill="#ffffff" /><text x="1170" y="664.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s34"><rect x="1140" y="1265.0" width="60" height="22" fill="#ffffff" /><text x="1170" y="1276.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s36"><rect x="1240.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1270.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s38"><rect x="1640.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1670.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,1)</text></g><g id="s39"><text x="70" y="56" font-family="Arial" font-size="19" fill="#56657a" text-anchor="start" dominant-baseline="central">ARGOS  /  MODELO ENTIDAD–RELACIÓN</text></g><g id="s40"><text x="70" y="110" font-family="Arial" font-size="36" fill="#233247" text-anchor="start" dominant-baseline="central" font-weight="700">Eventos y recepción de señales</text></g><g id="s41"><text x="70" y="158" font-family="Arial" font-size="18" fill="#56657a" text-anchor="start" dominant-baseline="central">Notación de Chen · derivado de backend/prisma/schema.prisma · 28 de octubre de 2026</text></g><g id="s42"><text x="70" y="204" font-family="Arial" font-size="18" fill="#233247" text-anchor="start" dominant-baseline="central">Rectángulo: entidad    /    Rombo: relación    /    Óvalo: atributo    /    Subrayado: identificador</text></g><g id="s43"><text x="70" y="242" font-family="Arial" font-size="17" fill="#233247" text-anchor="start" dominant-baseline="central">(mín,máx) junto a cada entidad: participaciones de esa instancia. N = muchas. Línea doble = obligatoria. ? = atributo opcional.</text></g><g id="s44"><text x="70" y="280" font-family="Arial" font-size="16" fill="#56657a" text-anchor="start" dominant-baseline="central">Las entidades en verde son referencias: su definición completa aparece en otra lámina.</text></g><g id="s45"><text x="70" y="1744" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Cada evento se vincula obligatoriamente a una sucursal y una zona coherentes entre sí.</text></g><g id="s46"><text x="70" y="1774" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Una recepción técnica puede no tener evento; varios reenvíos pueden vincularse al mismo evento.</text></g><g id="s47"><text x="70" y="1804" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">El estado de recepción es técnico. El estado de EventoSucursal corresponde a la gestión operativa.</text></g><g id="s48"><text x="2130" y="1858" font-family="Arial" font-size="15" fill="#56657a" text-anchor="end" dominant-baseline="central">04-eventos-recepcion  ·  Chen</text></g></svg>