="#ffffff" /><text x="1170" y="664.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s38"><rect x="1140" y="1265.0" width="60" height="22" fill="#ffffff" /><text x="1170" y="1276.0" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,1)</text></g><g id="s40"><rect x="500.0" y="601" width="60" height="22" fill="#ffffff" /><text x="530.0" y="612" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s42"><rect x="900.0" y="1281" width="60" height="22" fill="#ffffff" /><text x="930.0" y="1292" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s44"><rect x="900.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="930.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s46"><rect x="500.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="530.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s48"><rect x="1240.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1270.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(0,N)</text></g><g id="s50"><rect x="1640.0" y="1311" width="60" height="22" fill="#ffffff" /><text x="1670.0" y="1322" font-family="Arial" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">(1,1)</text></g><g id="s51"><text x="70" y="56" font-family="Arial" font-size="19" fill="#56657a" text-anchor="start" dominant-baseline="central">ARGOS  /  MODELO ENTIDAD–RELACIÓN</text></g><g id="s52"><text x="70" y="110" font-family="Arial" font-size="36" fill="#233247" text-anchor="start" dominant-baseline="central" font-weight="700">Infraestructura de monitoreo</text></g><g id="s53"><text x="70" y="158" font-family="Arial" font-size="18" fill="#56657a" text-anchor="start" dominant-baseline="central">Notación de Chen · derivado de backend/prisma/schema.prisma · 28 de octubre de 2026</text></g><g id="s54"><text x="70" y="204" font-family="Arial" font-size="18" fill="#233247" text-anchor="start" dominant-baseline="central">Rectángulo: entidad    /    Rombo: relación    /    Óvalo: atributo    /    Subrayado: identificador</text></g><g id="s55"><text x="70" y="242" font-family="Arial" font-size="17" fill="#233247" text-anchor="start" dominant-baseline="central">(mín,máx) junto a cada entidad: participaciones de esa instancia. N = muchas. Línea doble = obligatoria. ? = atributo opcional.</text></g><g id="s56"><text x="70" y="280" font-family="Arial" font-size="16" fill="#56657a" text-anchor="start" dominant-baseline="central">Las entidades en verde son referencias: su definición completa aparece en otra lámina.</text></g><g id="s57"><text x="70" y="1644" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Toda zona pertenece a una sucursal; pertenecer a una partición es opcional.</text></g><g id="s58"><text x="70" y="1674" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Cuando la zona tiene partición, ambas deben pertenecer a la misma sucursal (regla adicional).</text></g><g id="s59"><text x="70" y="1704" font-family="Arial" font-size="17" fill="#56657a" text-anchor="start" dominant-baseline="central">Cámaras y sensores se asocian a la zona, sin una relación directa inventada con el evento.</text></g><g id="s60"><text x="2130" y="1758" font-family="Arial" font-size="15" fill="#56657a" text-anchor="end" dominant-baseline="central">03-infraestructura  ·  Chen</text></g></svg>